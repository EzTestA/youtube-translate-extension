<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 280px;
            min-height: 240px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            color: #e0e0e0;
            padding: 16px 20px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .header-icon {
            font-size: 22px;
        }
        
        .header h1 {
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(90deg, #3ea6ff, #5b8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .settings-group {
            margin-bottom: 14px;
        }
        
        .settings-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 4px;
        }
        
        .settings-group select {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            transition: border-color 0.3s;
            cursor: pointer;
        }
        
        .settings-group select:focus {
            outline: none;
            border-color: #3ea6ff;
        }
        
        .settings-group select option {
            background: #1a1a1a;
        }
        
        .style-preview {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 12px;
            margin: 12px 0;
        }
        
        .style-preview .original {
            color: #e0e0e0;
            font-size: 13px;
        }
        
        .style-preview .translation {
            color: #3ea6ff;
            font-size: 12px;
            margin-top: 3px;
            padding-left: 8px;
            border-left: 2px solid #3ea6ff;
            opacity: 0.85;
            font-style: italic;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2a2a2a;
            font-size: 12px;
            color: #666;
        }
        
        .stats span {
            color: #3ea6ff;
            font-weight: 600;
        }
        
        .footer-note {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #222;
        }
        
        .footer-note .highlight {
            color: #3ea6ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-icon">🌐</span>
        <h1 id="appTitle">YouTube Translator</h1>
    </div>
    
    <!-- Выбор языка -->
    <div class="settings-group">
        <label id="labelTargetLang">🎯 Переводить на язык</label>
        <select id="targetLang">
            <option value="en" selected>🇬🇧 English</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="uk">🇺🇦 Українська</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>
    
    <!-- Превью стиля -->
    <div class="style-preview">
        <div class="original" id="previewOriginal">This is a comment in English</div>
        <div class="translation" id="previewTranslation">🇷🇺 Это комментарий на английском</div>
    </div>
    
    <!-- Статистика -->
    <div class="stats">
        <span id="statsTranslated">Переведено: <span id="translatedCount">0</span></span>
        <span id="statsApi">⚡ Google Translate</span>
    </div>
    
    <div class="footer-note" id="footerNote">
        💡 Нажмите <span class="highlight">«🌐 Перевести»</span> под комментарием
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
